apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-baseline
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.baseline
      rules:
        - alert: HomelabNodeUsingSwap
          expr: >-
            node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes < 0.90
            and node_memory_SwapTotal_bytes > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Swap usage detected on {{ $labels.instance }}
            description: More than 10% of swap has been in use for 15 minutes.

        - alert: HomelabPrometheusStorageNearlyFull
          expr: >-
            kubelet_volume_stats_available_bytes{
              namespace="monitoring",
              persistentvolumeclaim=~"prometheus-kube-prometheus-stack-prometheus-db-.*"
            } /
            kubelet_volume_stats_capacity_bytes{
              namespace="monitoring",
              persistentvolumeclaim=~"prometheus-kube-prometheus-stack-prometheus-db-.*"
            } < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Prometheus storage is nearly full
            description: >-
              PVC {{ $labels.persistentvolumeclaim }} has less than 15% free
              space remaining.

        - alert: HomelabHostCpuTemperatureHigh
          expr: >-
            node_hwmon_temp_celsius{
              chip=~".*(coretemp|k10temp|zenpower|cpu_thermal).*"
            } > 85
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: CPU temperature is high on {{ $labels.instance }}
            description: >-
              Sensor {{ $labels.chip }}/{{ $labels.sensor }} has remained above
              85 degrees Celsius for 10 minutes.

        - alert: HomelabSynologyTemperatureHigh
          expr: synology_system_temperature_celsius > 50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Synology system temperature is high
            description: >-
              The Synology system temperature has remained above 50 degrees
              Celsius for 15 minutes.

        - alert: HomelabSynologyDiskTemperatureHigh
          expr: synology_disk_temperature_celsius > 50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Synology disk {{ $labels.disk_name }} is hot
            description: >-
              Disk {{ $labels.disk_name }} ({{ $labels.disk_model }}) has
              remained above 50 degrees Celsius for 15 minutes.

        - alert: HomelabSynologyCoolingFailure
          expr: >-
            {__name__=~"synology_(thermal|system_fan|cpu_fan)_status"} != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Synology reports an abnormal cooling status
            description: >-
              {{ $labels.__name__ }} has reported a non-normal status for five
              minutes.
