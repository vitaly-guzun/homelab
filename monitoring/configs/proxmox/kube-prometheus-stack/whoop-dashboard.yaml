          "id": 19,
          "title": "Time in bed · sleep schedule",
          "type": "volkovlabs-echarts-panel",
          "gridPos": {
            "x": 0,
            "y": 73,
            "w": 24,
            "h": 11
          },
          "description": "One blue interval per main sleep, from local bedtime to local wake time. Dashed lines show selected-period mean bedtime and wake time. Clock values and averages come from PostgreSQL. Time in bed includes awake time; the date is the original local wake date.",
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "N/A",
              "color": {
