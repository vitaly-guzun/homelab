          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "whoop-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "whoop-postgres"
              },
              "rawQuery": true,
              "editorMode": "code",
              "format": "time_series",
              "rawSql": "SELECT time AS \"time\",\n  CASE WHEN recovery >= 67 THEN recovery END AS \"Green (≥67%)\",\n  CASE WHEN recovery >= 34 AND recovery < 67 THEN recovery END AS \"Yellow (34–66%)\",\n  CASE WHEN recovery < 34 THEN recovery END AS \"Red (≤33%)\"\nFROM whoop.daily WHERE $__timeFilter(time) AND recovery IS NOT NULL ORDER BY time"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "whoop-postgres"
              },
              "rawQuery": true,
              "editorMode": "code",
              "format": "time_series",
              "rawSql": "WITH history AS (\n  SELECT time, avg(recovery) OVER (\n    ORDER BY time RANGE BETWEEN (CASE\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '14 days' THEN 1\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '45 days' THEN 3\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '120 days' THEN 7\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '240 days' THEN 14\n    ELSE 30 END) * interval '24 hours' PRECEDING AND CURRENT ROW\n  ) AS average FROM whoop.daily\n  WHERE time >= $__timeFrom()::timestamptz - (CASE\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '14 days' THEN 1\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '45 days' THEN 3\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '120 days' THEN 7\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '240 days' THEN 14\n    ELSE 30 END) * interval '24 hours'\n    AND time <= $__timeTo()::timestamptz AND recovery IS NOT NULL\n)\nSELECT time AS \"time\", average AS value, 'AVG · ' || (CASE\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '14 days' THEN 1\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '45 days' THEN 3\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '120 days' THEN 7\n    WHEN $__timeTo()::timestamptz - $__timeFrom()::timestamptz <= interval '240 days' THEN 14\n    ELSE 30 END)::text || '-day window' AS metric\nFROM history WHERE $__timeFilter(time) ORDER BY time"
            }
          ]
        },
