          "description": "One solid-color bar per recorded cycle. Green ≥67%, yellow 34–66%, red ≤33%. Dashed AVG is a trailing mean of recorded observations, including history before the visible range. Window follows selected range: ≤14 days → 1 day; ≤45 → 3 days; ≤120 → 7 days; ≤240 → 14 days; longer → 30 days. The legend shows the active window. Missing values are not zero-filled.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "N/A",
              "color": {
