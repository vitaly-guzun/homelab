apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-snmp-exporter
  namespace: monitoring
spec:
  dependsOn:
    - name: kube-prometheus-stack
  interval: 30m
  chart:
    spec:
      chart: prometheus-snmp-exporter
      version: '9.17.1'
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  values:
    config: |-
      modules:
        synology:
          get:
            - 1.3.6.1.4.1.6574.1.2.0
            - 1.3.6.1.4.1.6574.1.4.1.0
            - 1.3.6.1.4.1.6574.1.4.2.0
            - 1.3.6.1.4.1.6574.1.8.0
          walk:
            - 1.3.6.1.4.1.6574.2.1.1
          max_repetitions: 25
          retries: 3
          timeout: 5s
          metrics:
            - name: synology_system_temperature_celsius
              oid: 1.3.6.1.4.1.6574.1.2
              type: gauge
              help: Synology storage system temperature in degrees Celsius.
            - name: synology_system_fan_status
              oid: 1.3.6.1.4.1.6574.1.4.1
              type: gauge
              help: Synology system fan status, where 1 is normal and 2 is failed.
            - name: synology_cpu_fan_status
              oid: 1.3.6.1.4.1.6574.1.4.2
              type: gauge
              help: Synology CPU fan status, where 1 is normal and 2 is failed.
            - name: synology_thermal_status
              oid: 1.3.6.1.4.1.6574.1.8
              type: gauge
              help: Synology thermal status, where 1 is normal and 2 is failed.
            - name: synology_disk_temperature_celsius
              oid: 1.3.6.1.4.1.6574.2.1.1.6
              type: gauge
              help: Synology drive temperature in degrees Celsius.
              indexes:
                - labelname: disk_index
                  type: gauge
              lookups:
                - labels: [disk_index]
                  labelname: disk_name
                  oid: 1.3.6.1.4.1.6574.2.1.1.12
                  type: DisplayString
                - labels: [disk_index]
                  labelname: disk_model
                  oid: 1.3.6.1.4.1.6574.2.1.1.3
                  type: DisplayString
            - name: synology_disk_status
              oid: 1.3.6.1.4.1.6574.2.1.1.5
              type: gauge
              help: Synology drive status code reported by DSM.
              indexes:
                - labelname: disk_index
                  type: gauge
              lookups:
                - labels: [disk_index]
                  labelname: disk_name
                  oid: 1.3.6.1.4.1.6574.2.1.1.12
                  type: DisplayString
                - labels: [disk_index]
                  labelname: disk_model
                  oid: 1.3.6.1.4.1.6574.2.1.1.3
                  type: DisplayString
    # snmp_exporter expands environment variables for SNMPv3 credentials, but
    # not for an SNMPv2c community. Render the auth config into an in-memory
    # volume so the SOPS-managed community does not have to live in a ConfigMap.
    extraArgs:
      - --config.file=/run/secrets/snmp-exporter/snmp-auth.yaml
    extraVolumes:
      - name: snmp-auth
        emptyDir:
          medium: Memory
    extraVolumeMounts:
      - name: snmp-auth
        mountPath: /run/secrets/snmp-exporter
        readOnly: true
    extraInitContainers:
      - name: render-snmp-auth
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        envFrom:
          - secretRef:
              name: synology-snmp-credentials
        command:
          - /bin/sh
          - -ec
        args:
          - |-
            umask 077
            printf 'auths:\n  synology_v2:\n    community: %s\n    security_level: noAuthNoPriv\n    auth_protocol: MD5\n    priv_protocol: DES\n    version: 2\n' "$SNMP_COMMUNITY" > /run/secrets/snmp-exporter/snmp-auth.yaml
        volumeMounts:
          - name: snmp-auth
            mountPath: /run/secrets/snmp-exporter
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
      selector:
        release: kube-prometheus-stack
      interval: 30s
      scrapeTimeout: 15s
      module:
        - synology
      auth:
        - synology_v2
      params:
        - name: synology
          target: 192.168.1.59
          labels:
            release: kube-prometheus-stack
          interval: 30s
          scrapeTimeout: 15s
          additionalMetricsRelabels:
            device: synology
      selfMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
