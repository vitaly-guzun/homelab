apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whoop-postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoop-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: whoop-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoop-postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-bookworm
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: whoop
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: whoop-postgres-credentials
                  key: admin-password
            - name: WHOOP_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: whoop-postgres-credentials
                  key: reader-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, whoop]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, whoop]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, whoop]
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: whoop-postgres
        - name: init
          configMap:
            name: whoop-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: whoop-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: whoop-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whoop-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: whoop-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: whoop-backup
      ports:
        - protocol: TCP
          port: 5432
