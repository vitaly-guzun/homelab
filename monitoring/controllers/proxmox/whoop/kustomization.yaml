apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - postgres.yaml
  - credentials.yaml
  - datasource.yaml
  - backup-cronjob.yaml
configMapGenerator:
  - name: whoop-postgres-init
    files:
      - init-db.sh
      - schema.sql
      - sleep-schedule.sql
  - name: whoop-backup-script
    files:
      - backup.sh
